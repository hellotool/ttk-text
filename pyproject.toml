[project]
name = "ttk-text"
version = "0.3.4"
description = "Themed Tkinter Text widget with modern styling support."
readme = "README_pypi.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jesse205", email = "jesse205@qq.com" },
]
maintainers = [
  { name = "Jesse205", email = "jesse205@qq.com" },
]
keywords = ["tk", "tk-text", "tkinter", "tkinter-text", "ttk", "ttk-text"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Microsoft :: Windows :: Windows 7",
  "Operating System :: Microsoft :: Windows :: Windows 8",
  "Operating System :: Microsoft :: Windows :: Windows 8.1",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
import-names = ["ttk_text"]

[project.urls]
Changelog = "https://github.com/hellotool/ttk-text/releases"
Repository = "https://github.com/hellotool/ttk-text"
Tracker = "https://github.com/hellotool/ttk-text/issues"

[dependency-groups]
dev = [
  { include-group = "basic" },
  { include-group = "docs" },
  { include-group = "example" },
  { include-group = "lint" },
  { include-group = "test" },
]
basic = [
  "poethepoet>=0.49.0 ; python_full_version >= '3.10'",
]
docs = [
  "rumdl>=0.3.2; python_version >= '3.9'",
  { include-group = "basic" },
]
example = [
  "sv-ttk>=2.6.0",
  { include-group = "basic" },
]
lint = [
  "pyright>=1.1.414",
  "ruff>=0.17.4",
  "tombi>=1.11.1 ; python_full_version >= '3.10'",
  { include-group = "basic" },
]
test = [
  "pytest>=8.3.5; python_version < '3.9'",
  "pytest>=8.4.2; python_version == '3.9'",
  "pytest>=9.0.3; python_version >= '3.10'",
  { include-group = "basic" },
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.7"
